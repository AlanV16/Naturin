{% for child in children %}
<div class="child-card" data-child-id="{{ child.id }}">
    <div>
        <h6 class="fw-bold mb-1">{{ child.get_full_name }}</h6>
        <small class="text-muted">Usuario: {{ child.username }}</small><br>
        <small class="text-muted">Correo: {{ child.email }}</small>
    </div>
</div>
{% empty %}
<div class="text-center py-4">
    <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
    <p class="text-muted mt-2">No tienes hijos vinculados aún</p>
</div>
{% endfor %}
